l_english:
 # Groups: adjective, noun, and the short regime label.
 # Communism, Liberal, Despotic and Ultranationalist reuse vanilla keys and
 # are named in replace/dnd_ideologies_replace_l_english.yml
 socialist: "Socialist"
 socialist_noun: "Socialism"
 socialist_desc: "Socialist State"
 social_democrat: "Social Democrat"
 social_democrat_noun: "Social Democracy"
 social_democrat_desc: "Democratic State"
 conservative: "Conservative"
 conservative_noun: "Conservatism"
 conservative_desc: "Democratic State"
 authoritarian_democrat: "Authoritarian"
 authoritarian_democrat_noun: "Authoritarianism"
 authoritarian_democrat_desc: "Managed State"

 # Vanguard Communist flavours
 marxism_leninism: "Marxism-Leninism"
 marxism_leninism_desc: "Rule by a disciplined vanguard party in the name of the working class, with the state directing the economy."
 maoism: "Maoism"
 maoism_desc: "A peasant-centred revolutionary communism built on protracted people's war and mass mobilisation."
 juche: "Juche"
 juche_desc: "A doctrine of total self-reliance under a ruling dynasty and its party."
 afro_marxism: "Afro-Marxism"
 afro_marxism_desc: "Marxist-Leninist rule adapted by African liberation movements, often born from the guerrilla struggle against colonialism."
 council_communism: "Council Communism"
 council_communism_desc: "Power held by workers' councils in mines, ports and factories rather than by a single party."
 year_zero: "Year Zero"
 year_zero_desc: "Total-war communism born from defeat. The cities are emptied, the old society is erased, and the party is the only institution left."

 # Socialist flavours
 democratic_socialism: "Democratic Socialism"
 democratic_socialism_desc: "Public ownership of the commanding heights of the economy, pursued through elections and mass movements."
 african_socialism: "African Socialism"
 african_socialism_desc: "A socialism rooted in communal African traditions rather than European class struggle."
 sankarism: "Sankarism"
 sankarism_desc: "Revolutionary austerity, land to the farmers, war on corruption and refusal of foreign debt, in the tradition of Thomas Sankara."
 ujamaa: "Ujamaa"
 ujamaa_desc: "Familyhood: cooperative villages, self-reliance and a single national movement, in the tradition of Julius Nyerere."
 lumumbism: "Lumumbism"
 lumumbism_desc: "A revived Congolese nationalism that claims the country's wealth for its people, in the memory of Patrice Lumumba."
 syndicalism: "Syndicalism"
 syndicalism_desc: "Trade unions and market associations govern directly, city by city."

 # Social Democrat flavours
 social_democracy: "Social Democracy"
 social_democracy_desc: "A market economy tempered by strong unions, public services and a welfare state."
 labourism: "Labourism"
 labourism_desc: "A party of organised labour governing through parliament."
 green_politics: "Green Politics"
 green_politics_desc: "Democracy organised around ecological survival and sustainable development."
 ubuntu_democracy: "Ubuntu Democracy"
 ubuntu_democracy_desc: "I am because we are. A pluralist, federal democracy that frames human rights in African terms."

 # Liberal flavours
 liberal_democracy: "Liberal Democracy"
 liberal_democracy_desc: "Free elections, independent courts, a free press and an open market."
 classical_liberalism: "Classical Liberalism"
 classical_liberalism_desc: "A small state, free trade and individual liberty above all."
 liberal_federalism: "Liberal Federalism"
 liberal_federalism_desc: "Power devolved to regions and peoples inside a democratic federation."
 technocratic_liberalism: "Technocratic Liberalism"
 technocratic_liberalism_desc: "Democracy run by experts, investors and international institutions."

 # Conservative flavours
 traditional_conservatism: "Traditional Conservatism"
 traditional_conservatism_desc: "Order, tradition, property and gradual reform."
 christian_democracy: "Christian Democracy"
 christian_democracy_desc: "Democratic politics guided by Christian social teaching."
 islamic_democracy: "Islamic Democracy"
 islamic_democracy_desc: "Democratic politics guided by Islamic values."
 constitutional_monarchism: "Constitutional Monarchism"
 constitutional_monarchism_desc: "A crowned head of state above politics, with an elected government beneath it."

 # Authoritarian flavours
 dominant_party: "Dominant-Party Rule"
 dominant_party_desc: "Elections are held, but the former liberation movement or ruling party always wins them."
 managed_democracy: "Managed Democracy"
 managed_democracy_desc: "The forms of democracy, with the outcomes arranged in advance."
 developmental_state: "Developmental State"
 developmental_state_desc: "A planning state that trades political freedom for rapid growth, roads, dams and factories."
 guided_democracy: "Guided Democracy"
 guided_democracy_desc: "A strong president above a weak parliament, claiming to stand above faction and tribe."
 modern_putinism: "Modern Putinism"
 modern_putinism_desc: "A security-service state behind a democratic façade, ruling through oligarchs, media control and nationalist pride."

 # Despotic flavours
 military_junta: "Military Junta"
 military_junta_desc: "Rule by the officers who seized power, always promising elections soon."
 big_man_rule: "Big-Man Rule"
 big_man_rule_desc: "A personal regime held together by patronage, loyalty and fear."
 absolute_monarchy: "Absolute Monarchy"
 absolute_monarchy_desc: "A ruling house that governs as well as reigns."
 theocracy: "Theocracy"
 theocracy_desc: "Clerics hold final authority over the state."
 jamahiriya: "Jamahiriya"
 jamahiriya_desc: "The 'state of the masses': people's committees in name, a single Leader in practice."
 chrome_capitalism: "Chrome Capitalism"
 chrome_capitalism_desc: "The corporation is the state. Walled arcologies, cyberware for those who can pay, and nothing for those outside the gates."
 machine_governance: "Machine Governance"
 machine_governance_desc: "An algorithm scores the citizens, writes the budget and, in the end, replaces the cabinet."

 # Ultranationalist flavours
 ultranationalism: "Ultranationalism"
 ultranationalism_desc: "The nation above all, its enemies everywhere."
 ethnonationalism: "Ethnonationalism"
 ethnonationalism_desc: "The state belongs to one people, and the others are tolerated at best."
 warlordism: "Warlordism"
 warlordism_desc: "Militias are the government, and war is the economy."
 holy_war: "Holy War"
 holy_war_desc: "A prophet-led movement that has taken up arms to remake the world in its faith."
 god_kingship: "God-Kingship"
 god_kingship_desc: "A crowned messiah and an imperial cult with a mission of conquest."

